<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tracking... Kolify Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #F8FAFC; }
        .gradient-text { background: linear-gradient(to right, #FF4B2B, #FF416C, #8A2387, #240b36); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .gradient-bg { background: linear-gradient(135deg, #FF4B2B, #8A2387, #4A00E0); }
        @keyframes custom-spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .spin-slow { animation: custom-spin 3s linear infinite; }
    </style>
</head>
<body class="text-slate-800 flex h-screen flex-col justify-center items-center">

    <div class="relative w-32 h-32 mb-8">
        <img src="kolify_logo_color.png" alt="Kolify Logo" class="absolute w-full h-full spin-slow object-contain">
    </div>
    
    <h2 class="text-3xl font-bold gradient-text mb-2">Extracting Data...</h2>
    <p class="text-slate-500 mb-6 font-medium">Processing 50 valid links via Kolify Engine. Please do not close.</p>
    
    <div class="w-96 bg-slate-200 rounded-full h-3 mb-2 overflow-hidden shadow-inner">
        <div id="progress-bar-fill" class="gradient-bg h-3 rounded-full w-[0%] transition-all duration-300"></div>
    </div>
    <p id="progress-text" class="font-mono text-sm font-bold text-slate-600">0 / 50 Links Completed</p>

    <!-- JavaScript สำหรับแอนิเมชันและเปลี่ยนหน้า -->
    <script>
        window.onload = function() {
            const progressBar = document.getElementById('progress-bar-fill');
            const progressText = document.getElementById('progress-text');
            let processed = 0;
            const totalLinks = 50; 
            
            const trackingInterval = setInterval(() => {
                processed += Math.floor(Math.random() * 5) + 2; 
                if (processed >= totalLinks) {
                    processed = totalLinks;
                    clearInterval(trackingInterval);
                    
                    // เมื่อโหลดครบ 100% รอ 1 วินาทีแล้วเด้งไปหน้า Dashboard ให้อัตโนมัติ
                    setTimeout(() => {
                        window.location.href = 'dashboard.html';
                    }, 1000);
                }
                progressBar.style.width = `${(processed / totalLinks) * 100}%`;
                progressText.innerText = `${processed} / ${totalLinks} Links Completed`;
            }, 300); 
        };
    </script>
</body>
</html>
