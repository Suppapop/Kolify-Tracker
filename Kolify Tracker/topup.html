<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Top Up - Kolify Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #F8FAFC; }
        .gradient-text { background: linear-gradient(to right, #FF4B2B, #FF416C, #8A2387, #240b36); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .gradient-bg { background: linear-gradient(135deg, #FF4B2B, #8A2387, #4A00E0); }
    </style>
</head>
<body class="text-slate-800">

    <nav class="bg-white shadow-sm border-b px-8 py-4 flex justify-between items-center sticky top-0 z-50">
        <div class="flex items-center space-x-6">
            <img src="kolify_logo_color.png" alt="Kolify Logo" class="w-12">
            <span class="font-bold text-xl tracking-tight text-slate-800">Kolify Tracker</span>
            <a href="workspace.html" class="text-slate-600 hover:text-blue-600 ml-8 font-medium">Workspace</a>
            <a href="history.html" class="text-slate-600 hover:text-blue-600 font-medium">History (DB)</a>
        </div>
        <div class="flex items-center space-x-4">
            <a href="workspace.html" class="bg-white border text-slate-700 px-4 py-2 rounded-lg font-medium hover:bg-slate-50">Cancel</a>
        </div>
    </nav>

    <div class="p-8 max-w-4xl mx-auto">
        <div class="text-center mb-10">
            <h1 class="text-4xl font-bold text-slate-800 mb-4">Top Up Credits</h1>
            <p class="text-slate-500">1 Credit = 1 Link Tracking. Secure payment via Omise.</p>
        </div>

        <div class="grid grid-cols-3 gap-6 mb-10">
            <div class="bg-white p-6 rounded-xl border shadow-sm hover:border-blue-500 cursor-pointer text-center flex flex-col justify-between">
                <div><h3 class="text-xl font-bold mb-2">Starter</h3><div class="text-3xl font-black gradient-text mb-4">100 Credits</div><p class="text-slate-500">฿500.00 THB</p></div>
            </div>
            <div class="bg-white p-6 rounded-xl border-2 border-purple-500 shadow-md relative text-center flex flex-col justify-between transform scale-105">
                <div class="absolute top-0 left-1/2 transform -translate-x-1/2 -translate-y-1/2 bg-purple-500 text-white text-xs font-bold px-3 py-1 rounded-full">MOST POPULAR</div>
                <div><h3 class="text-xl font-bold mb-2">Pro</h3><div class="text-3xl font-black gradient-text mb-2">500 Credits</div><p class="text-green-600 font-bold">฿2,375.00 THB</p></div>
            </div>
            <div class="bg-white p-6 rounded-xl border shadow-sm hover:border-blue-500 cursor-pointer text-center flex flex-col justify-between">
                <div><h3 class="text-xl font-bold mb-2">Agency</h3><div class="text-3xl font-black gradient-text mb-2">2,000 Credits</div><p class="text-green-600 font-bold">฿9,000.00 THB</p></div>
            </div>
        </div>

        <div class="bg-slate-50 border border-slate-200 rounded-xl p-8 max-w-2xl mx-auto flex items-center justify-between">
            <div>
                <h4 class="font-bold text-slate-700 mb-1">Selected: Pro Package</h4>
                <p class="text-2xl font-black text-slate-800">฿2,375.00</p>
            </div>
            <a href="workspace.html" onclick="alert('Payment Successful via Omise!')" class="bg-slate-800 text-white px-8 py-3 rounded-lg font-bold shadow-md hover:bg-slate-700 flex items-center">
                Pay with Omise
            </a>
        </div>
    </div>
</body>
</html>
