<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Kolify Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #F8FAFC; }
        .gradient-bg { background: linear-gradient(135deg, #FF4B2B, #8A2387, #4A00E0); }
    </style>
</head>
<body class="text-slate-800">
    <div class="flex h-screen w-full">
        <div class="w-1/2 gradient-bg flex flex-col justify-center items-center text-white p-12">
            <h1 class="text-5xl font-bold mb-4">Track Smarter.</h1>
            <p class="text-xl opacity-90 text-center">The ultimate Micro SaaS for instant influencer campaign tracking.</p>
        </div>
        <div class="w-1/2 flex flex-col justify-center items-center bg-white">
            <img src="kolify_logo_color.png" alt="Kolify Logo" class="w-32 mb-8">
            <h2 class="text-3xl font-bold mb-8">Welcome to Kolify Tracker</h2>
            
            <!-- กดล็อกอินแล้ว พาเข้า workspace.html หลักทันที -->
            <a href="workspace.html" class="flex items-center justify-center bg-white border border-slate-300 text-slate-700 font-medium py-3 px-8 rounded-lg shadow-sm hover:bg-slate-50 transition w-80">
                <svg class="w-5 h-5 mr-3" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
                Continue with Google
            </a>

            <div class="flex items-center w-80 my-5">
                <div class="flex-grow border-t border-slate-200"></div>
                <span class="mx-4 text-xs font-bold text-slate-400 uppercase tracking-wider">Or</span>
                <div class="flex-grow border-t border-slate-200"></div>
            </div>

            <a href="workspace.html" class="flex items-center justify-center bg-slate-800 text-white font-medium py-3 px-8 rounded-lg shadow-sm hover:bg-slate-700 transition w-80 mb-4">
                Log In / Sign Up with Email
            </a>
        </div>
    </div>

</html>
